<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тарих – Флешкарталар мен Тест</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent2: #a78bfa;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #34d399;
      --danger: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 1rem; }
    header {
      text-align: center;
      padding: 1.5rem 0 1rem;
    }
    header h1 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    header p { color: var(--muted); font-size: 0.95rem; }
    .nav {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1.2rem 0;
    }
    .nav button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .nav button:hover, .nav button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .stats span { color: var(--accent); font-weight: 600; }
    /* Flashcard */
    .flash-area { perspective: 1200px; margin: 1.5rem auto; max-width: 640px; }
    .flashcard {
      width: 100%;
      min-height: 280px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .face.back { transform: rotateY(180deg); background: linear-gradient(145deg, #1e293b, #312e81); }
    .face .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.8rem;
    }
    .face .content { font-size: 1.15rem; font-weight: 500; }
    .face.back .content { color: var(--success); font-size: 1.25rem; }
    .controls {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }
    .controls button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1.3rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .controls button.primary { background: var(--accent); color: #0f172a; border: none; font-weight: 600; }
    .controls button:hover { opacity: 0.9; }
    /* Quiz */
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.8rem;
      max-width: 640px;
      margin: 0 auto;
    }
    .quiz-card .q { font-size: 1.15rem; margin-bottom: 1.4rem; font-weight: 500; }
    .options { display: flex; flex-direction: column; gap: 0.7rem; }
    .options button {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      font-size: 0.98rem;
      transition: all 0.15s;
    }
    .options button:hover:not(:disabled) { border-color: var(--accent); background: #1e293b; }
    .options button.correct { background: rgba(52,211,153,0.15); border-color: var(--success); color: var(--success); }
    .options button.wrong { background: rgba(248,113,113,0.15); border-color: var(--danger); color: var(--danger); }
    .options button:disabled { cursor: default; }
    .quiz-result {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 1.1rem;
    }
    /* List */
    .search-box {
      width: 100%;
      max-width: 640px;
      margin: 0 auto 1rem;
      display: block;
      padding: 0.8rem 1.1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.7rem;
    }
    .list-item .lq { font-weight: 500; margin-bottom: 0.4rem; }
    .list-item .la { color: var(--success); font-size: 0.95rem; }
    .hidden { display: none !important; }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin: 0.8rem auto 0;
      max-width: 640px;
      overflow: hidden;
    }
    .progress-bar div {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s;
    }
    footer {
      text-align: center;
      padding: 2rem 0 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Тарих ПББ</h1>
      <p>Флешкарталар • Тест • Барлық сұрақтар</p>
    </header>

    <div class="nav">
      <button id="btn-flash" class="active">🃏 Флешкарта</button>
      <button id="btn-quiz">✏️ Тест</button>
      <button id="btn-list">📋 Тізім</button>
    </div>

    <div class="stats">
      <div>Сұрақтар: <span id="total-count">0</span></div>
      <div>Дұрыс: <span id="correct-count">0</span></div>
      <div>Қате: <span id="wrong-count">0</span></div>
    </div>
    <div class="progress-bar"><div id="progress" style="width:0%"></div></div>

    <!-- FLASH -->
    <section id="section-flash">
      <div class="flash-area">
        <div class="flashcard" id="flashcard">
          <div class="face front">
            <div class="label">Сұрақ</div>
            <div class="content" id="flash-q">Жүктелуде...</div>
          </div>
          <div class="face back">
            <div class="label">Жауап</div>
            <div class="content" id="flash-a"></div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="prev-btn">← Алдыңғы</button>
        <button id="flip-btn" class="primary">Аудару</button>
        <button id="next-btn">Келесі →</button>
        <button id="shuffle-btn">🔀 Араластыру</button>
      </div>
      <p style="text-align:center;color:var(--muted);margin-top:0.8rem;font-size:0.9rem">
        <span id="flash-index">1</span> / <span id="flash-total">0</span>
      </p>
    </section>

    <!-- QUIZ -->
    <section id="section-quiz" class="hidden">
      <div class="quiz-card">
        <div class="q" id="quiz-q">...</div>
        <div class="options" id="quiz-options"></div>
        <div class="quiz-result" id="quiz-result"></div>
        <div class="controls" style="margin-top:1.2rem">
          <button id="quiz-next" class="primary hidden">Келесі сұрақ →</button>
          <button id="quiz-restart">Қайта бастау</button>
        </div>
      </div>
    </section>

    <!-- LIST -->
    <section id="section-list" class="hidden">
      <input type="search" class="search-box" id="search" placeholder="Іздеу...">
      <div id="list-container"></div>
    </section>

    <footer>Тарих сұрақтары • Жергілікті сақтау • 2026</footer>
  </div>

  <script>
    // ===== DATA (will be loaded) =====
    let questions = [];
    let currentIndex = 0;
    let shuffled = [];
    let correct = 0, wrong = 0;
    let quizIndex = 0;
    let quizOrder = [];

    // Load data
    async function loadData() {
      if (window.QA_FALLBACK && window.QA_FALLBACK.length) {
        questions = window.QA_FALLBACK;
      } else {
        try {
          const res = await fetch('qa_data.json');
          questions = await res.json();
        } catch (e) {
          questions = [];
        }
      }
      if (!questions.length) {
        document.getElementById('flash-q').textContent = 'Деректер жүктелмеді';
        return;
      }
      document.getElementById('total-count').textContent = questions.length;
      shuffled = [...Array(questions.length).keys()];
      shuffleArray(shuffled);
      currentIndex = 0;
      showFlash();
      updateStats();
      renderList();
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // ===== NAV =====
    const sections = {
      flash: document.getElementById('section-flash'),
      quiz: document.getElementById('section-quiz'),
      list: document.getElementById('section-list')
    };
    document.getElementById('btn-flash').onclick = () => switchMode('flash');
    document.getElementById('btn-quiz').onclick = () => { switchMode('quiz'); startQuiz(); };
    document.getElementById('btn-list').onclick = () => switchMode('list');

    function switchMode(mode) {
      Object.values(sections).forEach(s => s.classList.add('hidden'));
      sections[mode].classList.remove('hidden');
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + mode).classList.add('active');
    }

    // ===== FLASH =====
    const card = document.getElementById('flashcard');
    function showFlash() {
      if (!shuffled.length) return;
      const idx = shuffled[currentIndex];
      const item = questions[idx];
      document.getElementById('flash-q').textContent = item.q;
      document.getElementById('flash-a').textContent = item.a;
      card.classList.remove('flipped');
      document.getElementById('flash-index').textContent = currentIndex + 1;
      document.getElementById('flash-total').textContent = shuffled.length;
    }
    card.onclick = () => card.classList.toggle('flipped');
    document.getElementById('flip-btn').onclick = () => card.classList.toggle('flipped');
    document.getElementById('next-btn').onclick = () => {
      currentIndex = (currentIndex + 1) % shuffled.length;
      showFlash();
    };
    document.getElementById('prev-btn').onclick = () => {
      currentIndex = (currentIndex - 1 + shuffled.length) % shuffled.length;
      showFlash();
    };
    document.getElementById('shuffle-btn').onclick = () => {
      shuffleArray(shuffled);
      currentIndex = 0;
      showFlash();
    };

    // ===== QUIZ =====
    function startQuiz() {
      quizOrder = [...Array(questions.length).keys()];
      shuffleArray(quizOrder);
      quizIndex = 0;
      correct = 0; wrong = 0;
      updateStats();
      showQuizQuestion();
    }

    function showQuizQuestion() {
      if (quizIndex >= quizOrder.length) {
        document.getElementById('quiz-q').textContent = 'Тест аяқталды!';
        document.getElementById('quiz-options').innerHTML = '';
        document.getElementById('quiz-result').textContent = `Дұрыс: ${correct} / Қате: ${wrong}`;
        document.getElementById('quiz-next').classList.add('hidden');
        return;
      }
      const item = questions[quizOrder[quizIndex]];
      document.getElementById('quiz-q').textContent = item.q;
      document.getElementById('quiz-result').textContent = '';
      document.getElementById('quiz-next').classList.add('hidden');

      // Generate 4 options
      const options = [item.a];
      const others = questions.filter((_, i) => i !== quizOrder[quizIndex]);
      shuffleArray(others);
      for (let i = 0; i < 3 && i < others.length; i++) {
        options.push(others[i].a);
      }
      shuffleArray(options);

      const container = document.getElementById('quiz-options');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(btn, opt, item.a);
        container.appendChild(btn);
      });
    }

    function selectAnswer(btn, selected, correctAns) {
      const buttons = document.querySelectorAll('#quiz-options button');
      buttons.forEach(b => b.disabled = true);
      if (selected === correctAns) {
        btn.classList.add('correct');
        correct++;
        document.getElementById('quiz-result').textContent = '✅ Дұрыс!';
        document.getElementById('quiz-result').style.color = 'var(--success)';
      } else {
        btn.classList.add('wrong');
        wrong++;
        document.getElementById('quiz-result').textContent = '❌ Қате. Дұрыс жауап: ' + correctAns;
        document.getElementById('quiz-result').style.color = 'var(--danger)';
        buttons.forEach(b => { if (b.textContent === correctAns) b.classList.add('correct'); });
      }
      updateStats();
      document.getElementById('quiz-next').classList.remove('hidden');
    }

    document.getElementById('quiz-next').onclick = () => {
      quizIndex++;
      showQuizQuestion();
    };
    document.getElementById('quiz-restart').onclick = startQuiz;

    function updateStats() {
      document.getElementById('correct-count').textContent = correct;
      document.getElementById('wrong-count').textContent = wrong;
      const total = correct + wrong;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      document.getElementById('progress').style.width = pct + '%';
    }

    // ===== LIST =====
    function renderList(filter = '') {
      const cont = document.getElementById('list-container');
      cont.innerHTML = '';
      const f = filter.toLowerCase();
      questions.forEach((item, i) => {
        if (f && !item.q.toLowerCase().includes(f) && !item.a.toLowerCase().includes(f)) return;
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<div class="lq">${i + 1}. ${item.q}</div><div class="la">${item.a}</div>`;
        cont.appendChild(div);
      });
    }

лылық құқығы жойылғаннан және XIX ғасырдың екінші жартысындағы өлкеде жүргізілген әкімшілік реформалардан кейін кеңінен қоныс аудара бастады. 1897 жылы Қазақстан аумағында 4 миллионнан астам адам өмір сүрді, олардың 81,7%-ын қазақтар құрады. Тұрғындардың қалған бөлігі қазақтар мен қоныс аударушы шаруалар, ұйғыр, дүңген, татар, өзбек т.б. ұлт өкілдерінен тұрды. Қоныс аударушылардың едәуір бөлігі Қазақстанға XIX ғасырдың соңы мен XX ғасырдың басында келді. Украиндықтардың алғашқы тобы Қазақстан аумағында XVIII ғасырдың екінші жартысында пайда болды. Украиндықтардың басты шаруашылық кәсібі егіншілік болды. Қазақ даласындағы белгілі украиндық диқандардың бірі Ақмола облысының Атбасар ауданы Қима болысына қарасты Запорожское селосының шаруасы Василий Марченко еді. Ол егістік топырағының құнарлылығын арттыру мақсатымен тұқым себудің жетілдірілген әдісін енгізді. Сұрақ: XVIIІ ғасырдың екінші жартысында өлкеде пайда болған украиндық қатарында көп кездесті", "a": "Ұлт-азаттық қозғалысқа қатысушылар"}, {"q": "1945 жылы 7 мамырда Герман капитуляциясының алғашқы шартына қол қойған одақтас күштердің бас қолбасшысы кім болды?", "a": "Дуайт Эйзенхауер"}, {"q": "ХІ ғасырдан бастап мұсылман әлемін біріктіруге тырысты қай династия?", "a": "Салжұқтар"}, {"q": "Спартадағы беделді алқалы органның атауы қандай болды?", "a": "Эфорлар колегиясы"}, {"q": "Қазақ даласындағы украиндық диқандар мен Василий Марченконың үлесі қандай болды?", "a": "Тұқым себудің жетілдірілген әдісін енгізді"}, {"q": "Столыпиннің аграрлық реформасы кезінде немістер қай жерлерден қоныс аударды?", "a": "Қара теңіз жағалауынан, Еділ бойынан"}, {"q": "1857-1859 жылдардағы Үндістандағы сипайлар көтерілісінің себебі", "a": "«Оқ дәрісін шошқа майымен оралған қағазға орау»"}, {"q": "«Егер Бұланты мен Аңырақай жеңістері болмаса,100 жыл бұрын құрып біткен Ноғайлардың күйін кешер едік» деген кімнің сөзі", "a": "М. Мағауин 4-Нұсқа"}, {"q": "Италияда жоғары бағаға ие болған неореалистік фильмдерді олардың режиссерлерімен сәйке да Бұрындық ханға барлық жағынан бағынды», – деп жазады Мұхаммед Хайдар. Қасым сұлтан деректерде алғашында Бұрындық ханның «белгiлi сұлтаны, атты әскер басшысының бiрi» ретiнде айтылады. «Тарих-и-Рашидиде» айтылғандай, «Қасым хан Жошы ханнан кейiн ешкiм жете алмаған бүкiл Дештi Қыпшақтағы қуатты әмiршiге айналып, даңқы мен құдiретi артты». Қасымның iшкi саясаты. Қасым хандық билiктi нығайтуда, салт-дәстүр мен заңдылықты сақтауда iрi табыстарға жетті. Мемлекеттi нығайту үшiн Қасым заң шығарды. Қасым ханның заңдары халық жадында «Қасым ханның қасқа жолы» деген атпен сақталып қалды. Мұхаммед Хайдардың деректеріне сәйкес, Қасым ханның қол астындағы халық саны бір миллион адамнан асты. Жауынгерлерінің саны жетті?", "a": "300мың"}, {"q": "Б.з.д. VIII ғасырда Рим қаласы пайда болды. «Патер» әке деген сөз, яғни қаланың негізін өздерінің әкелері қалағанын римнің өте ертедегі тұрғындарының ұрпақтары мақтан еткен. Олар ортақ егіндік жері мен жайылымдығы бар қауым болып тұрды. еткен. Әрбір отбасын латынша фамилия деп атады. Аристократтар өзінің шығу тегі жағынан бұрыннан ауқаттылардың қатарына жататын ежелгі ұрпақ, ата-бабасының даңқы шыққан адамдары болды.Рим Республикасында патрицийлердің ақсақалдары құрған кеңес сенат Рим өмірінде ерекше орын алды. Рим империясының негізін қалағандар", "a": "ағайынды Ромул мен Рем"}, {"q": "Үндістан мен Пәкістан арасындағы шиеленіске себеп болған аумақ", "a": "Кашмир"}, {"q": "Хақназар хан билік еткен жылдар", "a": "1538-1580жж"}, {"q": "Хақназар хан өзін қазақтар мен ноғайлар ханы деп атады. Ал тарихшылар", "a": "қазақтар мен қырғыздар ханы деп атаған"}, {"q": "Хақназар хан елшілік қарым – қатынас орнатты", "a": "Мәскеу билеушісімен 12-БӨЛІМ"}, {"q": "1557 жылы Хақназар хан бастаған қазақ әскерлері Жайықтың арғы бетіне қарай өтіп Еділге қарай ығыстырды", "a": "Ноғайларды"}, {"q": "Хақназар хан Абдаллахты Шайбани әулетіне жататын Баба Сұлтанға қарсы күресте қолдау себебі", "a": "Ташкент аймағын Қазақ хандығына қосып алу"}, {"q": "Өнеркәсіп т
